<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Changer Lab</title>

    <style>
        /* Layout containers */
#box-container {
    display: flex;
    gap: 10px;
}

#button-container {
    margin-top: 20px;
}

/* Box styling */
.box {
    width: 200px;
    height: 200px;
    background-color: lightgray;
    border: 2px solid black;
    margin: 10px;
    padding: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;
}

    </style>
</head>
<body>

    <h1 id="main-heading">Color Changer Lab</h1>

    <!-- Box container -->
    <div id="box-container">
        <div class="box" id="box1">Box 1</div>
        <div class="box" id="box2">Box 2</div>
        <div class="box" id="box3">Box 3</div>
    </div>

    <!-- Buttons -->
    <div id="button-container">
        <button id="btn-red">Make Red</button>
        <button id="btn-blue">Make Blue</button>
        <button id="btn-green">Make Green</button>
        <button id="reset-btn">Reset All</button>
    </div>

    <script defer>
    // Select all boxes
    const boxes = document.querySelectorAll(".box");

    if (boxes.length === 0) {
        console.error("No boxes found");
    }

    // Select buttons
    const redBtn = document.getElementById("btn-red");
    const blueBtn = document.getElementById("btn-blue");
    const greenBtn = document.getElementById("btn-green");
    const resetBtn = document.getElementById("reset-btn");

    if (!redBtn || !blueBtn || !greenBtn || !resetBtn) {
        console.error("One or more buttons not found");
    }

    // Event listeners
    redBtn.addEventListener("click", () => {
        boxes.forEach(box => {
            box.style.backgroundColor = "red";
        });
    });

    blueBtn.addEventListener("click", () => {
        boxes.forEach(box => {
            box.style.backgroundColor = "blue";
        });
    });

    greenBtn.addEventListener("click", () => {
        boxes.forEach(box => {
            box.style.backgroundColor = "green";
        });
    });

    resetBtn.addEventListener("click", () => {
        boxes.forEach(box => {
            box.style.backgroundColor = "lightgray";
        });
    });
</script>


</body>
</html>
