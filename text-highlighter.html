<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Highlighter</title>

    <style>
       .highlight {
    background-color: rgb(111, 255, 0);
    padding: 10px;
    border-left: 4px solid rgb(196, 41, 17);
}

    </style>
</head>
<body>

    <h1 id="page-title">Text Highlighter</h1>

    <p class="paragraph">This is the first paragraph.</p>
    <p class="paragraph">This is the second paragraph.</p>
    <p class="paragraph">This is the third paragraph.</p>
    <p class="paragraph">This is the fourth paragraph.</p>

    <div>
        <button id="highlight-btn">Highlight All</button>
        <button id="clear-btn">Clear Highlights</button>
        <button id="toggle-btn">Toggle First Paragraph</button>
    </div>

   <script defer>
    // Select paragraphs
    const paragraphs = document.querySelectorAll(".paragraph");
    const firstParagraph = document.querySelector(".paragraph");

    if (paragraphs.length === 0) {
        console.error("No paragraphs found");
    }

    if (!firstParagraph) {
        console.error("First paragraph not found");
    }

    // Select buttons
    const highlightBtn = document.getElementById("highlight-btn");
    const clearBtn = document.getElementById("clear-btn");
    const toggleBtn = document.getElementById("toggle-btn");

    if (!highlightBtn || !clearBtn || !toggleBtn) {
        console.error("One or more buttons not found");
    }

    // Highlight all paragraphs
    highlightBtn.addEventListener("click", () => {
        paragraphs.forEach(p => {
            p.classList.add("highlight");
        });
    });

    // Clear highlights
    clearBtn.addEventListener("click", () => {
        paragraphs.forEach(p => {
            p.classList.remove("highlight");
        });
    });

    // Toggle first paragraph only
    toggleBtn.addEventListener("click", () => {
        firstParagraph.classList.toggle("highlight");
    });
</script>


</body>
</html>
