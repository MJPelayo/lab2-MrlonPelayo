<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOM Selection Practice</title>
</head>
<body>

    <!-- Heading -->
    <h1 id="title">DOM Selection Lab</h1>

    <!-- Paragraphs -->
    <p class="info">This is the first paragraph.</p>
    <p class="info">This is the second paragraph.</p>
    <p class="info">This is the third paragraph.</p>

    <!-- Container with buttons -->
    <div id="container">
        <button class="action-btn">Action 1</button>
        <button class="action-btn">Action 2</button>
        <button id="special-btn">Special Action</button>
    </div>

    <!-- JavaScript -->
    <script defer>

    // Select title using getElementById
    const title = document.getElementById("title");

    if (!title) {
        console.error("Title element not found");
    } else {
        console.log("Title:", title);
    }

    // Select first paragraph using querySelector
    const firstParagraph = document.querySelector(".info");

    if (!firstParagraph) {
        console.error("Paragraph with class 'info' not found");
    } else {
        console.log("First paragraph:", firstParagraph);
    }

    // Select all buttons with class 'action-btn'
    const actionButtons = document.querySelectorAll(".action-btn");

    if (actionButtons.length === 0) {
        console.error("No action buttons found");
    } else {
        console.log("Action buttons:", actionButtons);
    }
</script>

</body>
</html>
